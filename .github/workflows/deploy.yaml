name: Deploy Production

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or ref to deploy (defaults to the workflow SHA)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Immutable commit SHA or ref to deploy"
        required: false
        type: string
        default: ""

concurrency:
  group: cf-temp-email-production
  cancel-in-progress: false

jobs:
  backend:
    name: Deploy Backend
    uses: ./.github/workflows/backend_deploy.yaml
    with:
      ref: ${{ inputs.ref || github.sha }}
    secrets: inherit

  frontend:
    name: Deploy Frontend
    needs: backend
    uses: ./.github/workflows/frontend_pagefunction_deploy.yaml
    with:
      ref: ${{ inputs.ref || github.sha }}
    secrets: inherit
