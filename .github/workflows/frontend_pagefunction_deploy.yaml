name: Deploy Frontend with page function

on:
  workflow_call:
    inputs:
      sha:
        description: "Full 40-character commit SHA to deploy"
        required: true
        type: string

concurrency:
  group: cf-temp-email-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 10.10.0
          run_install: false

      - name: Deploy Frontend for ${{ github.ref_name }}
        run: |
          cd frontend/
          pnpm install --frozen-lockfile
          pnpm build:pages
          cd ../pages/
          ../frontend/node_modules/.bin/wrangler pages deploy --branch production
          echo "Deployed production for ref ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
