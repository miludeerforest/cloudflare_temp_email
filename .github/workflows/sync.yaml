name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    outputs:
      needs_deploy: ${{ steps.sync.outputs.needs_deploy }}
      after_sha: ${{ steps.sync.outputs.after_sha }}
      deployed_sha: ${{ steps.sync.outputs.deployed_sha }}
    steps:
      - name: Sync upstream changes
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh repo sync "${{ github.repository }}" --source dreamhunter2333/cloudflare_temp_email --branch main
          AFTER_SHA="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')"
          DEPLOYED_SHA=""
          if DEPLOYED_SHA="$(gh api repos/${{ github.repository }}/git/ref/heads/production-deployed --jq '.object.sha' 2>/dev/null)"; then
            echo "Last deployed SHA: $DEPLOYED_SHA"
          else
            echo "production-deployed ref does not exist yet"
          fi
          echo "after_sha=$AFTER_SHA" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          if [[ -z "$DEPLOYED_SHA" || "$AFTER_SHA" != "$DEPLOYED_SHA" ]]; then
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deployment is required for $AFTER_SHA"
          else
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Main is already deployed at $AFTER_SHA"
          fi

  deploy:
    name: Deploy synced revision
    needs: sync_latest_from_upstream
    if: ${{ needs.sync_latest_from_upstream.outputs.needs_deploy == 'true' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      sha: ${{ needs.sync_latest_from_upstream.outputs.after_sha }}
    secrets: inherit
